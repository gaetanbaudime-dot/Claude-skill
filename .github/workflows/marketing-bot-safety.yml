name: Marketing bot safety
on:
  pull_request:
    branches: [main]
    paths:
      - "tools/bot_clippers/**"
      - ".github/workflows/marketing-bot-safety.yml"
  push:
    branches: [main]
    paths:
      - "tools/bot_clippers/**"
      - ".github/workflows/marketing-bot-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot dependencies
        run: python -m pip install -r tools/bot_clippers/requirements.txt
      - name: Validate Python syntax and non-destructive exit safeguards
        working-directory: tools/bot_clippers
        run: python -m unittest discover -s tests -p "test_*.py" -v
