name: Diagnostic Instagram (FlashAPI)

# 23/10 : teste plusieurs façons de tourner les pages de FlashAPI sur des comptes dont on connaît la vérité (Metricool) et écrit
# le détail dans l'onglet « IG · Diagnostic » du tableur App clippers · usage. Lancement manuel seulement ; ne touche pas au suivi.
on:
  workflow_dispatch:
    inputs:
      comptes:
        description: "Comptes à tester (séparés par des virgules ; vide = la liste par défaut)"
        required: false
        default: ""

concurrency:
  group: suivi-instagram
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/bot_clippers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/bot_clippers/requirements.txt
      - run: pip install -r requirements.txt
      - name: Historique du suivi (pour les ID Instagram)
        uses: actions/cache/restore@v4
        with:
          path: tools/bot_clippers/donnees_ci
          key: suivi-instagram-diag-${{ github.run_id }}
          restore-keys: suivi-instagram-
      - name: Diagnostic
        run: python diagnostic_instagram.py
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLASSEUR_LOGINS_ID: 1z7LxKU70PdXfU0HWCtPltWqT84GwFQJTnOAFZdBnyDY
          ADRESSES_CLASSEUR_ID: 1-zZipXCmi1esYo8QsWDYk8DSDpKMxjQzfRt3uNuXPqI
          SUIVI_FICHIER: donnees_ci/instagram.json
          RAPIDAPI_QUOTA_JOUR: "8000"
          DIAG_COMPTES: ${{ github.event.inputs.comptes }}
