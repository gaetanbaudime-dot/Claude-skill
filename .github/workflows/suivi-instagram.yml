name: Suivi Instagram (RapidAPI)

# 22/10 : followers, Reels et vues de tous les comptes du LOG DASHBOARD IG, 3 fois par jour, indépendamment de Railway.
# Écrit les onglets « IG · Comptes », « IG · Reels », « IG · Top Reels » du tableur App clippers · usage.
on:
  schedule:
    - cron: "0 5,12,19 * * *"          # 7 h, 14 h, 21 h à Paris (heure d'été ; 6 h, 13 h, 20 h en hiver)
  workflow_dispatch:

concurrency:
  group: suivi-instagram
  cancel-in-progress: false

jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/bot_clippers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/bot_clippers/requirements.txt
      - run: pip install -r requirements.txt
      - name: Historique du suivi (passage précédent)
        uses: actions/cache/restore@v4
        with:
          path: tools/bot_clippers/donnees_ci
          key: suivi-instagram-${{ github.run_id }}
          restore-keys: suivi-instagram-
      - name: Passage complet
        run: python suivi_instagram_ci.py
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CLASSEUR_LOGINS_ID: 1z7LxKU70PdXfU0HWCtPltWqT84GwFQJTnOAFZdBnyDY
          ADRESSES_CLASSEUR_ID: 1-zZipXCmi1esYo8QsWDYk8DSDpKMxjQzfRt3uNuXPqI
          SUIVI_FICHIER: donnees_ci/instagram.json
      - name: Garder l'historique pour le prochain passage
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/bot_clippers/donnees_ci
          key: suivi-instagram-${{ github.run_id }}
